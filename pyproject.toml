[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-estimation"
version = "0.0.1"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "Unified interface for monocular depth estimators (Depth Anything, Depth Anything V2, Distill-Any-Depth, DPT, MiDaS 3.1, ZoeDepth, Depth Pro, GLPN, Prompt Depth Anything, TIPSv2 DPT)."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pillow>=10.1",
    "torch",
    "torchvision",
    "transformers>=5.20,<6",
    "pyyaml",
]

[project.scripts]
depth-estimate = "depth_estimation.cli:EstimateCommand.main"

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/DepthEstimation"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/DepthEstimation/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "types-PyYAML", "mypy", "basedpyright", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
depth_estimation = ["py.typed", "config/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["pretrained: downloads real model weights; run with --run-pretrained"]

[tool.mypy]
strict = true
mypy_path = "src"
untyped_calls_exclude = ["transformers"]

[[tool.mypy.overrides]]
module = ["torchvision.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportMissingTypeStubs = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "D", "PT", "C4", "PIE", "RET"]
ignore = ["D100", "D104", "D105", "D107", "D200", "D205"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
